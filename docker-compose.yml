services:
  cronfleet:
    build: .
    container_name: cronfleet
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATA_DIR=/app/data
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:4000}
      - SETUP_CODE=${SETUP_CODE:-}
      - RESET_AUTH=${RESET_AUTH:-false}
      # Optional: trust an internal Enterprise Root CA for LDAPS / OIDC
      # - NODE_EXTRA_CA_CERTS=/app/data/certs/enterprise-ca.crt
    volumes:
      - ./data:/app/data:Z
